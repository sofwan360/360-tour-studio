<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RUDY HOME — 360 Tour</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101214;color:#eee;font:14px Arial,sans-serif}header{height:54px;background:#191d20;border-bottom:1px solid #333;display:flex;align-items:center;gap:14px;padding:0 18px}#brand{color:#c9a879;font-weight:700;letter-spacing:.5px;white-space:nowrap}#sceneSelect{max-width:260px;background:#252a2e;color:#eee;border:1px solid #42494e;border-radius:4px;padding:8px}#sceneTitle{color:#aeb8be;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}#stage{height:calc(100% - 54px);position:relative;background:#090a0b}canvas{width:100%;height:100%;display:block;touch-action:none;cursor:grab}canvas:active{cursor:grabbing}#pins{position:absolute;inset:0;pointer-events:none}.pin{position:absolute;transform:translate(-50%,-50%);pointer-events:auto;background:#c9a879;color:#171717;border:2px solid #fff;border-radius:20px;padding:8px 11px;font-size:12px;font-weight:bold;box-shadow:0 3px 14px #0009;white-space:nowrap;cursor:pointer}#tip{position:absolute;bottom:82px;left:50%;transform:translateX(-50%);background:#171b1edb;border:1px solid #485057;border-radius:4px;padding:8px 12px;color:#bfc7cc;font-size:10px;letter-spacing:.5px;pointer-events:none}#floorBtn{margin-left:auto;background:#252a2e;color:#ddd;border:1px solid #42494e;border-radius:4px;padding:8px 11px;cursor:pointer}#floorPanel{display:none;position:absolute;right:14px;top:14px;max-width:min(360px,45vw);max-height:70vh;background:#171b1e;border:1px solid #555;border-radius:6px;padding:10px;z-index:5}#floorMapWrap{position:relative;display:inline-block;max-width:100%}#floorPanel img{display:block;max-width:100%;max-height:60vh}#floorMarkers{position:absolute;inset:0;pointer-events:none}.floorMark{position:absolute;transform:translate(-50%,-50%);pointer-events:auto;background:#c9a879;color:#171717;border:2px solid white;border-radius:50%;width:25px;height:25px;font-weight:bold;cursor:pointer}#floorPanel button{margin-top:8px;background:#30363a;color:#fff;border:1px solid #555;padding:6px 10px}#noScenes{position:absolute;inset:0;display:grid;place-items:center;color:#999}
 
/* Minimal client-facing tour interface */
header{display:none!important}#stage{position:fixed!important;inset:0!important;height:100%!important}
#clientProjectLabel{position:absolute;left:20px;top:18px;z-index:4;padding:9px 13px;border-radius:10px;background:#17171799;backdrop-filter:blur(10px);font-size:11px;font-weight:700;letter-spacing:.08em;max-width:38vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#clientRoomRail{position:absolute;right:20px;top:50%;transform:translateY(-50%);z-index:5;width:174px;max-height:76vh;overflow:auto;padding:9px;background:#f7f7f4ed;border:1px solid #fff9;border-radius:20px;display:flex;flex-direction:column;gap:9px;box-shadow:0 10px 35px #0003;scrollbar-width:thin}
.client-room-card{position:relative;display:block;width:100%;height:118px;padding:0;border:2px solid transparent;border-radius:13px;overflow:hidden;background:#242424;cursor:pointer;flex:none}
.client-room-card img{display:block;width:100%;height:100%;object-fit:cover}.client-room-card.active{border-color:#4d54ed;box-shadow:0 0 0 2px #4d54ed55}.client-room-card.active:after{content:'CURRENT ROOM';position:absolute;left:7px;top:7px;padding:3px 6px;border-radius:9px;background:#4d54ed;color:#fff;font-size:7px;font-weight:700;letter-spacing:.05em}
.client-room-card .room-label{position:absolute;left:0;right:0;bottom:0;padding:22px 10px 9px;text-align:left;color:white;font-size:12px;font-weight:650;background:linear-gradient(transparent,#000b)}
.client-room-card .room-count{position:absolute;right:7px;top:7px;padding:3px 6px;border-radius:12px;background:#111b;color:#fff;font-size:8px}
#clientControls{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);z-index:4;display:flex;align-items:center;gap:8px;padding:7px 12px;border-radius:30px;background:#171717b8;backdrop-filter:blur(10px)}
#clientControls button,#floorBtn{width:40px;height:40px;border:0;border-radius:50%;background:transparent;color:white;font-size:24px;cursor:pointer}
#clientControls button:hover,#floorBtn:hover{background:#ffffff22}
#clientControls span{width:1px;height:22px;background:#ffffff55;margin:0 3px}
#floorBtn{position:absolute!important;left:20px;bottom:20px;z-index:4;background:#171717b8;border:1px solid #ffffff33}
#clientLogo{position:absolute;right:20px;bottom:18px;z-index:4;width:68px;height:auto;max-height:38px;object-fit:contain;filter:drop-shadow(0 2px 6px #0005)}
#clientRenderModal{display:none;position:fixed;inset:0;z-index:30;background:#08090bdc;backdrop-filter:blur(8px);align-items:center;justify-content:center;padding:24px}
#clientRenderModal.open{display:flex}#clientRenderModal section{width:min(1100px,94vw);max-height:90vh;overflow:auto;background:#f6f6f3;color:#202326;border-radius:18px;padding:18px}
#clientRenderModal header{display:flex!important;position:static!important;height:auto!important;background:transparent!important;border:0!important;color:#202326;padding:0 0 14px!important;justify-content:space-between}
#clientRenderModal h2{margin:0;font-size:18px}#clientRenderSub{display:block;color:#73797d;font-size:10px;margin-top:5px}
#clientRenderClose,#clientImageClose{width:38px;height:38px;border:0;border-radius:50%;background:#e5e6e3;color:#222;font-size:22px;cursor:pointer}
#clientRenderGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(280px,100%),1fr));gap:13px}
.client-render-tile{border:1px solid #ddd;border-radius:11px;overflow:hidden;background:#fff;padding:0;text-align:left;cursor:zoom-in}
.client-render-tile img{display:block;width:100%;height:auto;max-height:60vh;object-fit:contain;background:#e9e9e6}
.client-render-tile span{display:block;padding:9px 11px;color:#222;font-size:11px;font-weight:600}
#clientRenderEmpty{padding:36px;text-align:center;color:#777;background:#eee;border-radius:10px}
#clientImageLightbox{display:none;position:fixed;inset:0;z-index:40;background:#050505f2;align-items:center;justify-content:center;padding:25px}
#clientImageLightbox.open{display:flex}#clientLargeImage{max-width:94vw;max-height:88vh;object-fit:contain}
#clientImageClose{position:absolute;right:22px;top:18px;background:#ffffff25;color:#fff}
@media(max-width:700px){#clientRoomRail{right:8px;top:auto;bottom:76px;transform:none;width:118px;max-height:52vh;padding:6px;gap:6px;border-radius:14px}.client-room-card{height:82px}.client-room-card .room-label{font-size:10px;padding:16px 7px 6px}#clientProjectLabel{left:9px;top:9px;font-size:9px}#tip{display:none}#clientControls{bottom:12px;padding:4px 7px;gap:2px}#clientControls button{width:34px;height:34px;font-size:20px}#floorBtn{left:9px;bottom:12px;width:36px;height:36px}#clientLogo{right:9px;bottom:13px;width:50px;max-height:28px}#clientRenderModal{padding:9px}#clientRenderModal section{padding:13px}}

const fs='precision highp float;varying vec2 uv;uniform sampler2D pano;uniform vec2 resolution;uniform float yaw;uniform float pitch;uniform float fov;const float PI=3.14159265359;void main(){float aspect=resolution.x/resolution.y;float sx=(uv.x-.5)*2.*aspect*tan(radians(fov)*.5);float sy=(uv.y-.5)*2.*tan(radians(fov)*.5);vec3 dir=normalize(vec3(sx,sy,1.));float cp=cos(pitch),sp=sin(pitch),cy=cos(yaw),syaw=sin(yaw);dir=vec3(dir.x,dir.y*cp-dir.z*sp,dir.y*sp+dir.z*cp);dir=vec3(dir.x*cy+dir.z*syaw,dir.y,-dir.x*syaw+dir.z*cy);float u=atan(dir.x,dir.z)/(2.*PI)+.5;float v=asin(clamp(dir.y,-1.,1.))/PI+.5;gl_FragColor=texture2D(pano,vec2(fract(u),clamp(1.-v,0.,1.)));}';
function sh(type,src){let x=gl.createShader(type);gl.shaderSource(x,src);gl.compileShader(x);if(!gl.getShaderParameter(x,gl.COMPILE_STATUS))throw Error(gl.getShaderInfoLog(x));return x}
function init(){if(!gl){alert('WebGL is not available in this browser.');return}prog=gl.createProgram();gl.attachShader(prog,sh(gl.VERTEX_SHADER,vs));gl.attachShader(prog,sh(gl.FRAGMENT_SHADER,fs));gl.linkProgram(prog);if(!gl.getProgramParameter(prog,gl.LINK_STATUS))throw Error(gl.getProgramInfoLog(prog));gl.useProgram(prog);let b=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,b);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);let l=gl.getAttribLocation(prog,'p');gl.enableVertexAttribArray(l);gl.vertexAttribPointer(l,2,gl.FLOAT,false,0,0);tex=gl.createTexture();gl.bindTexture(gl.TEXTURE_2D,tex);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);resize()}
function resize(){if(!gl)return;let d=Math.min(devicePixelRatio||1,2);canvas.width=Math.max(1,Math.round(canvas.clientWidth*d));canvas.height=Math.max(1,Math.round(canvas.clientHeight*d));gl.viewport(0,0,canvas.width,canvas.height);draw()}
function draw(){if(!gl||!prog||!img||!img.complete)return;gl.useProgram(prog);gl.bindTexture(gl.TEXTURE_2D,tex);gl.uniform2f(gl.getUniformLocation(prog,'resolution'),canvas.width,canvas.height);gl.uniform1f(gl.getUniformLocation(prog,'yaw'),yaw*Math.PI/180);gl.uniform1f(gl.getUniformLocation(prog,'pitch'),pitch*Math.PI/180);gl.uniform1f(gl.getUniformLocation(prog,'fov'),fov);gl.drawArrays(gl.TRIANGLE_STRIP,0,4);drawPins()}
function norm(a){while(a>180)a-=360;while(a< -180)a+=360;return a}
function drawPins(){let layer=document.getElementById('pins');layer.innerHTML='';let s=P.scenes[idx],aspect=canvas.clientWidth/canvas.clientHeight,hfov=2*Math.atan(aspect*Math.tan(fov*Math.PI/360))*180/Math.PI;(s.hotspots||[]).forEach(h=>{let dx=norm(h.yaw-yaw),dy=h.pitch-pitch;if(Math.abs(dx)>hfov*.48||Math.abs(dy)>fov*.48)return;let x=50+dx/hfov*100,y=50-dy/fov*100;if(x<1||x>99||y<1||y>99)return;let btn=document.createElement('button');btn.className='pin';btn.textContent=h.title||'Go to scene';btn.style.left=x+'%';btn.style.top=y+'%';btn.onclick=()=>{let n=P.scenes.findIndex(z=>z.id===h.target);if(n>=0)loadScene(n)};layer.appendChild(btn)})}
function syncActiveRoomCard(){document.querySelectorAll('.client-room-card').forEach((card,i)=>{card.classList.toggle('active',i===idx);card.setAttribute('aria-current',i===idx?'true':'false')})}
function loadScene(n){idx=(n+P.scenes.length)%P.scenes.length;let s=P.scenes[idx];yaw=Number(s.yaw)||0;pitch=Number(s.pitch)||0;fov=Number(s.fov)||75;document.getElementById('sceneSelect').value=String(idx);document.getElementById('sceneTitle').textContent=s.name;syncActiveRoomCard();img=new Image();img.onload=()=>{gl.bindTexture(gl.TEXTURE_2D,tex);gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL,false);gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,img);draw()};img.onerror=()=>alert('Could not load panorama: '+s.src);img.src=s.src;drawPins()}
function buildSceneMenu(){let sel=document.getElementById('sceneSelect');P.scenes.forEach((s,i)=>{let o=document.createElement('option');o.value=i;o.textContent=s.name;sel.appendChild(o)});sel.onchange=()=>loadScene(Number(sel.value))}
canvas.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY,yaw,pitch};canvas.setPointerCapture(e.pointerId)});canvas.addEventListener('pointermove',e=>{if(!drag)return;yaw=drag.yaw-(e.clientX-drag.x)/canvas.clientWidth*180;pitch=Math.max(-85,Math.min(85,drag.pitch+(e.clientY-drag.y)/canvas.clientHeight*140));draw()});canvas.addEventListener('pointerup',()=>drag=null);canvas.addEventListener('pointercancel',()=>drag=null);canvas.addEventListener('wheel',e=>{e.preventDefault();fov=Math.max(35,Math.min(105,fov+e.deltaY*.04));draw()},{passive:false});window.addEventListener('resize',resize);
function buildClientRoomRail(){const rail=document.getElementById('clientRoomRail');rail.innerHTML='';P.scenes.forEach((s,i)=>{const rs=s.renderImages||[];const b=document.createElement('button');b.type='button';b.className='client-room-card';const im=document.createElement('img');im.src=rs[0]?.src||s.src;im.alt=s.name;const label=document.createElement('span');label.className='room-label';label.textContent=s.name;const count=document.createElement('span');count.className='room-count';count.textContent=rs.length?rs.length+' RENDER':'NO RENDER';b.append(im,label,count);b.onclick=()=>{if(idx!==i){loadScene(i)}else{openClientRenders(i)}};rail.appendChild(b)})}
function openClientRenders(i){const s=P.scenes[i],grid=document.getElementById('clientRenderGrid');document.getElementById('clientRenderTitle').textContent=s.name;document.getElementById('clientRenderSub').textContent=(s.renderImages||[]).length+' render image(s)';grid.innerHTML='';if(!(s.renderImages||[]).length){grid.innerHTML='<div id="clientRenderEmpty">Belum ada hasil render untuk ruangan ini.</div>'}else{s.renderImages.forEach((r,j)=>{const b=document.createElement('button');b.type='button';b.className='client-render-tile';const im=document.createElement('img');im.src=r.src;im.alt=r.name||s.name;const cap=document.createElement('span');cap.textContent=r.name||'Render '+(j+1);b.append(im,cap);b.onclick=()=>{document.getElementById('clientLargeImage').src=r.src;document.getElementById('clientImageLightbox').classList.add('open')};grid.appendChild(b)})}document.getElementById('clientRenderModal').classList.add('open')}
document.getElementById('clientRenderClose').onclick=()=>document.getElementById('clientRenderModal').classList.remove('open');document.getElementById('clientRenderModal').addEventListener('click',e=>{if(e.target.id==='clientRenderModal')e.currentTarget.classList.remove('open')});
document.getElementById('clientImageClose').onclick=()=>document.getElementById('clientImageLightbox').classList.remove('open');document.getElementById('clientImageLightbox').addEventListener('click',e=>{if(e.target.id==='clientImageLightbox')e.currentTarget.classList.remove('open')});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){document.getElementById('clientRenderModal').classList.remove('open');document.getElementById('clientImageLightbox').classList.remove('open')}});
document.getElementById('clientPrev').onclick=()=>loadScene(idx-1);document.getElementById('clientNext').onclick=()=>loadScene(idx+1);document.getElementById('clientFull').onclick=()=>{if(!document.fullscreenElement)document.documentElement.requestFullscreen?.();else document.exitFullscreen?.()};
if(P.floorPlan){document.getElementById('floorBtn').onclick=()=>{document.getElementById('floorImage').src=P.floorPlan;let layer=document.getElementById('floorMarkers');layer.innerHTML='';(P.floorMarkers||[]).forEach(m=>{let b=document.createElement('button');b.className='floorMark';b.style.left=m.x+'%';b.style.top=m.y+'%';b.textContent='•';b.title=(P.scenes.find(z=>z.id===m.scene)||{}).name||'Open scene';b.onclick=()=>{let n=P.scenes.findIndex(z=>z.id===m.scene);if(n>=0){document.getElementById('floorPanel').style.display='none';loadScene(n)}};layer.appendChild(b)});document.getElementById('floorPanel').style.display='block'};document.getElementById('floorClose').onclick=()=>document.getElementById('floorPanel').style.display='none'}
if(!P.scenes.length)document.getElementById('noScenes').style.display='grid';else{init();buildSceneMenu();buildClientRoomRail();loadScene(0)}
</script></body></html>
